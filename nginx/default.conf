# ============================================================
# RMS YASKAWA - NGINX CONFIGURATION
# Laravel | PHP 8.5 | PostgreSQL 16 | Reverb WebSocket proxy
# Host Port : 8080 | Docker Port : 80
# ============================================================

server {
    listen 80 default_server;

    server_name localhost 127.0.0.1 _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 100M;

    # Preserve external port during Nginx redirects
    absolute_redirect off;

    # Runtime Docker DNS: Nginx tetap bisa start saat Reverb belum siap.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # ========================================================
    # LOGGING (PRESERVED)
    # ========================================================

    access_log /var/log/nginx/rms.access.log;
    error_log /var/log/nginx/rms.error.log warn;

    # ========================================================
    # NEW: YASKAWA RMS LIVE (Laravel Reverb)
    # Browser: ws://localhost:8080/app/<PUBLIC_APP_KEY>
    # Reverb:  http://reverb_yaskawa:8080/app/<PUBLIC_APP_KEY>
    # IMPORTANT: keep URI path intact (no trailing slash in proxy_pass).
    # ========================================================
    location ^~ /app/ {
        # Variable upstream delays DNS lookup until a WebSocket request arrives.
        # Thus failure of Reverb does not prevent normal Laravel pages from loading.
        set $rms_reverb_upstream "reverb_yaskawa:8080";
        proxy_pass http://$rms_reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Only Laravel backend is allowed to call the privileged Reverb API
    # directly over Docker's internal network.
    location ^~ /apps/ { return 404; }
    location = /apps { return 404; }

    # ========================================================
    # LARAVEL ROUTING (PRESERVED)
    # ========================================================

    location / {
        # Do not use $uri/ here.
        # public/rms is also an asset directory.
        # Laravel must handle /rms and /rms/.
        try_files $uri /index.php$is_args$args;
    }

    # ========================================================
    # PHP-FPM 8.5 (PRESERVED)
    # ========================================================

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass php_yaskawa:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;

        # Forward original browser Host including port 8080
        fastcgi_param HTTP_HOST $http_host;

        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # ========================================================
    # SECURITY (PRESERVED)
    # ========================================================

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
