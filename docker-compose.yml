# Local development/test only. Root .env configures Docker; src/.env configures Laravel.
name: rms-yaskawa-sqlserver

services:
  sqlserver_yaskawa:
    container_name: sqlserver_yaskawa
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Isi MSSQL_SA_PASSWORD di .env root}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver_yaskawa_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5
          -Q "SET NOCOUNT ON; SELECT 1" -o /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  php_yaskawa:
    container_name: php_yaskawa
    build:
      context: ./php
    image: rms-yaskawa-php-sqlserver:local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    depends_on:
      sqlserver_yaskawa:
        condition: service_healthy

  reverb_yaskawa:
    container_name: reverb_yaskawa
    image: rms-yaskawa-php-sqlserver:local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    stop_grace_period: 20s
    depends_on:
      php_yaskawa:
        condition: service_started

  scheduler_yaskawa:
    container_name: scheduler_yaskawa
    image: rms-yaskawa-php-sqlserver:local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 60s
    depends_on:
      php_yaskawa:
        condition: service_started

  nginx_yaskawa:
    container_name: nginx_yaskawa
    build:
      context: ./nginx
    image: rms-yaskawa-nginx-sqlserver:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php_yaskawa:
        condition: service_started

volumes:
  sqlserver_yaskawa_data:
